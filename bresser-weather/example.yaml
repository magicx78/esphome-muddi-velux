# Reference configuration for LilyGO TTGO LoRa32 T3 v1.6.1 (SX1276 @ 868 MHz).
# See docs/pinout-t3-v1.6.1.md and docs/finding-sensor-ids.md before flashing.

esphome:
  name: bresser-weather-rx
  friendly_name: Bresser Weather Receiver

esp32:
  # Generic ESP32 board; the T3 v1.6.1 uses the WROOM-32 module. We declare
  # all pins explicitly under bresser_weather: so the specific board variant
  # macros (LORA_*) are not needed.
  board: esp32dev
  framework:
    type: arduino

logger:
  level: DEBUG

api:
ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

external_components:
  - source:
      type: git
      url: https://github.com/magicx78/esphome-bresser-weather
    components: [bresser_weather]
  # Local development:
  # - source: components
  #   components: [bresser_weather]

bresser_weather:
  id: bresser_hub
  sck_pin: 5
  miso_pin: 19
  mosi_pin: 27
  cs_pin: 18
  rst_pin: 23
  dio0_pin: 26
  dio1_pin: 33
  decoders: [5in1, 6in1, 7in1]
  max_sensors: 4

# Add one entry per physical Bresser sensor in range.
# On first flash leave this list empty and watch the log for lines like:
#   [D][bresser_weather] RX id=0x12345678 type=1 ...
# Then add the discovered ID(s) below.
sensor:
  - platform: bresser_weather
    sensor_id: 0x12345678
    temperature:
      name: "Garten Temperatur"
    humidity:
      name: "Garten Feuchte"
    wind_speed:
      name: "Wind Avg"
    wind_gust:
      name: "Wind Böe"
    wind_direction:
      name: "Wind Richtung"
    rain:
      name: "Regen Total"
    rssi:
      name: "Bresser RSSI"
